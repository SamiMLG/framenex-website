# Framenex CMS (Sveltia CMS) – runs on cms.framenex.com, protected by Cloudflare Access.
# Every save becomes a commit in GitHub; Cloudflare Pages then rebuilds framenex.com (~1 minute).
# (Generated with shared field groups expanded – edit carefully.)

backend:
  name: github
  repo: DEIN-GITHUB-NAME/framenex-website
  branch: main
  commit_messages:
    create: "CMS: {{collection}} „{{slug}}“ angelegt"
    update: "CMS: {{collection}} „{{slug}}“ geändert"
    delete: "CMS: {{collection}} „{{slug}}“ gelöscht"
    uploadMedia: "CMS: Bild {{path}} hochgeladen"
    deleteMedia: "CMS: Bild {{path}} gelöscht"
site_url: https://framenex.com
display_url: https://framenex.com
locale: de
media_folder: src/media
public_folder: /media
collections:
  - name: projekte
    label: Referenzen (Galerie)
    label_singular: Projekt
    description: Projekte auf der Referenzen-Seite. Reihenfolge über das Feld „Reihenfolge“.
    folder: content/projekte
    format: json
    create: true
    delete: true
    slug: "{{fields.id}}"
    identifier_field: title
    summary: "{{fields.order}} · {{fields.title}}"
    sortable_fields:
      - order
      - title
    fields:
      - label: Titel
        name: title
        widget: string
      - label: Kurzname für die Adresse (klein
        ohne Leerzeichen: null
        z. B. „hochzeit-mueller“): null
        name: id
        widget: string
        pattern:
          - ^[a-z0-9-]+$
          - Nur Kleinbuchstaben, Zahlen und Bindestriche
      - label: Reihenfolge
        name: order
        widget: number
        value_type: int
        hint: 1 = ganz oben
      - label: Ausblenden
        name: hidden
        widget: boolean
        required: false
        default: false
      - label: Kategorie-Zeile (z. B. „Kurzfilm · Eigenproduktion“)
        name: cardLabel
        widget: string
      - label: Kurzbeschreibung
        name: lead
        widget: text
      - label: Filter
        name: categories
        widget: relation
        collection: einstellungen
        file: filter
        value_field: filters.*.id
        display_fields:
          - filters.*.label
        multiple: true
        hint: Nicht „Alle“ auswählen – das gilt automatisch.
      - label: Breites Layout
        name: layout
        widget: select
        options:
          - standard
          - wide
        default: standard
      - label: Hervorgehoben
        name: featured
        widget: boolean
        required: false
        default: false
      - label: Titelbild
        name: cover
        widget: object
        fields:
          - label: Bild
            name: src
            widget: image
          - label: Handy-Version (optional)
            name: mobileSrc
            widget: image
            required: false
          - label: Bildbeschreibung
            name: alt
            widget: string
          - label: Bildausschnitt (optional
            z. B. „50% 40%“): null
            name: position
            widget: string
            required: false
          - name: width
            widget: hidden
            required: false
          - name: height
            widget: hidden
            required: false
      - label: Projektdaten
        name: meta
        widget: object
        fields:
          - label: Kunde
            name: client
            widget: string
            required: false
          - label: Leistung
            name: service
            widget: string
            required: false
          - label: Branche
            name: industry
            widget: string
            required: false
          - label: Ort
            name: location
            widget: string
            required: false
      - label: Beschreibung (Absätze)
        name: description
        widget: list
        required: false
        field:
          label: Absatz
          name: absatz
          widget: text
      - label: Fakten (Aufzählung)
        name: facts
        widget: list
        required: false
        field:
          label: Fakt
          name: fakt
          widget: string
      - label: Externer Link (optional)
        name: externalLink
        widget: object
        required: false
        collapsed: true
        fields:
          - label: Linktext
            name: label
            widget: string
            required: false
          - label: Adresse
            name: href
            widget: string
            required: false
      - label: Galerie (Bilder & Videos)
        name: media
        widget: list
        typeKey: type
        types:
          - label: Bild
            name: image
            widget: object
            summary: "{{fields.alt}}"
            fields:
              - label: Bild
                name: src
                widget: image
              - label: Handy-Version (optional)
                name: mobileSrc
                widget: image
                required: false
              - label: Bildbeschreibung
                name: alt
                widget: string
              - name: width
                widget: hidden
                required: false
              - name: height
                widget: hidden
                required: false
          - label: YouTube-Video
            name: youtube
            widget: object
            summary: ▶ {{fields.title}}
            fields:
              - label: YouTube-ID (z. B. „KFjceyu0w7Q“ aus youtube.com/watch?v=KFjceyu0w7Q)
                name: id
                widget: string
              - label: Titel
                name: title
                widget: string
